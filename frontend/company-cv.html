<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CVQR — CV Preview</title>
  <link rel="stylesheet" href="styles/shared.css" />
</head>
<body>
  <div class="phone">
    <div class="status-bar"><span data-current-time>9:41</span><span>●●●</span></div>
    <div class="nav-bar">
      <a class="back" href="company-history.html">‹ Scanned</a>
      <span class="title">CV Preview</span>
    </div>

    <div class="content">
      <div id="companyCvNotice" class="notice hidden"></div>

      <div class="card">
        <div class="card-row"><span class="card-label">Student</span><span id="studentName" class="card-value">—</span></div>
        <div class="card-row"><span class="card-label">Email</span><span id="studentEmail" class="card-value">—</span></div>
        <div class="card-row"><span class="card-label">File</span><span id="companyCvFile" class="card-value">—</span></div>
      </div>

      <div class="preview-frame" id="previewFrame"></div>
      <a id="downloadCvLink" class="btn btn-primary" href="#" target="_blank" rel="noopener">⬇ Download CV</a>
    </div>

    <div class="tab-bar">
      <a class="tab" href="company-history.html"><div class="tab-icon">📋</div><span>Scanned</span></a>
      <a class="tab active" href="company-scan.html"><div class="tab-icon">📷</div><span>Scan</span></a>
      <a class="tab" href="#" data-logout><div class="tab-icon">👤</div><span>Logout</span></a>
    </div>
  </div>
  <script src="scripts/common.js"></script>
  <script src="scripts/company-cv.js"></script>
</body>
</html>
