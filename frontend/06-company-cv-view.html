<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CVQR - Gescande CV</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/common.css">
</head>
<body>

  <header class="site-header dashboard-header">
    <div class="container header-inner">
      <div class="brand">
        <i class="fa-solid fa-file-lines"></i>
        <div>
          <h1>Gescande CV</h1>
          <p>Bekijk gegevens en open de PDF.</p>
        </div>
      </div>
      <nav class="header-actions">
        <a class="button button-secondary" href="05-company-scanner.html">Nieuwe scan</a>
        <a class="button button-secondary" href="07-company-scan-history.html">Historiek</a>
      </nav>
    </div>
  </header>

  <main class="container page-main two-column wide-right">
    <section class="card">
      <h2>Studentgegevens</h2>
      <div id="message" class="message hidden"></div>
      <dl class="info-list">
        <div><dt>Naam</dt><dd id="studentName">-</dd></div>
        <div><dt>E-mail</dt><dd id="studentEmail">-</dd></div>
        <div><dt>Bestand</dt><dd id="fileName">-</dd></div>
        <div><dt>Gescand op</dt><dd id="scannedAt">-</dd></div>
      </dl>
      <div class="button-row">
        <a id="downloadLink" class="button" href="#" target="_blank" rel="noopener">Open PDF</a>
      </div>
    </section>

    <section class="card pdf-card">
      <h2>PDF voorbeeld</h2>
      <div class="pdf-frame-wrapper">
        <iframe id="pdfFrame" title="PDF voorbeeld"></iframe>
      </div>
    </section>
  </main>

  <script src="scripts/config.js"></script>
  <script src="scripts/utils.js"></script>
  <script src="scripts/company-view.js"></script>
</body>
</html>
