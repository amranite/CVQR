<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CVQR - Student upload</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/common.css">
</head>
<body>

  <header class="site-header dashboard-header">
    <div class="container header-inner">
      <div class="brand">
        <i class="fa-solid fa-user-graduate"></i>
        <div>
          <h1>Student dashboard</h1>
          <p>Upload je CV en laat een QR genereren.</p>
        </div>
      </div>
      <nav class="header-actions">
        <a class="button button-secondary" href="04-student-cv.html">Mijn CV</a>
        <button type="button" class="button logout-button" id="logoutButton">Uitloggen</button>
      </nav>
    </div>
  </header>

  <main class="container page-main two-column">
    <section class="card">
      <h2>CV uploaden</h2>
      <p class="section-text">Kies een PDF-bestand van maximaal 5 MB.</p>
      <div id="message" class="message hidden"></div>
      <form id="uploadForm" class="stack-form" enctype="multipart/form-data">
        <div>
          <label for="cv">PDF-bestand</label>
          <input type="file" id="cv" name="cv" accept=".pdf,application/pdf" required>
        </div>
        <div class="button-row">
          <button type="submit" class="button">Upload CV</button>
        </div>
      </form>
    </section>

    <section class="card aside-card">
      <h2>Wat gebeurt er?</h2>
      <ul class="feature-list compact-list">
        <li><i class="fa-solid fa-file-pdf"></i> Je PDF wordt lokaal opgeslagen.</li>
        <li><i class="fa-solid fa-qrcode"></i> Er wordt een QR-code aangemaakt.</li>
        <li><i class="fa-solid fa-clock"></i> De token vervalt na 72 uur.</li>
        <li><i class="fa-solid fa-pen"></i> Je kan later vervangen of verwijderen.</li>
      </ul>
    </section>
  </main>

  <script src="scripts/config.js"></script>
  <script src="scripts/utils.js"></script>
  <script src="scripts/student-home.js"></script>
</body>
</html>
