<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CVQR</title>
  <script>
    const role = localStorage.getItem("cvqr_role");
    if (role === "student") location.replace("student.html");
    else if (role === "company") location.replace("company-scan.html");
    else if (role === "admin") location.replace("admin.html");
    else location.replace("login.html");
  </script>
</head>
<body></body>
</html>
