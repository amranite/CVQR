<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>CVQR</title>
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
   <link rel="stylesheet" href="/css/common.css">
</head>

<body>
   <header class="site-header">
      <div class="container header-inner">
         <a class="brand" href="/" aria-label="CVQR home">
            <i class="fa-solid fa-file-lines"></i>
            <div>
               <h1>CVQR</h1>
               <p>Connect students and companies through QR codes.</p>
            </div>
         </a>
      </div>
   </header>

   <main class="container page-main">
      <section class="card hero-card simple-home">
         <h2>Welcome</h2>
         <p>Log in or create an account to continue.</p>

         <div class="button-row">
            <a class="button" href="/login/">
               <i class="fa-solid fa-right-to-bracket"></i>
               Log in
            </a>
            <a class="button button-secondary" href="/register/">
               <i class="fa-solid fa-user-plus"></i>
               Register
            </a>
         </div>
      </section>
   </main>
</body>

</html>
