<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CVQR — Scanned CVs</title>
  <link rel="stylesheet" href="styles/shared.css" />
</head>
<body>
  <div class="phone">
    <div class="status-bar"><span data-current-time>9:41</span><span>●●●</span></div>
    <div class="nav-bar">
      <span class="title">Scanned CVs</span>
      <a class="action logout-link" href="#" data-logout>Log out</a>
    </div>

    <div class="content">
      <div id="historyNotice" class="notice hidden"></div>
      <div id="historyCount" class="section-title">0 CVs collected</div>
      <div id="historyList"></div>
      <div id="historyEmpty" class="empty-state hidden">
        <div class="empty-icon">📋</div>
        <div class="empty-title">No scans yet</div>
        <div class="empty-sub">Once you scan a student's QR code, it will appear here.</div>
      </div>
    </div>

    <div class="tab-bar">
      <a class="tab active" href="company-history.html"><div class="tab-icon">📋</div><span>Scanned</span></a>
      <a class="tab" href="company-scan.html"><div class="tab-icon">📷</div><span>Scan</span></a>
      <a class="tab" href="#" data-logout><div class="tab-icon">👤</div><span>Logout</span></a>
    </div>
  </div>
  <script src="scripts/common.js"></script>
  <script src="scripts/company-history.js"></script>
</body>
</html>
