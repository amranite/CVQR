<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CVQR — Register</title>
  <link rel="stylesheet" href="styles/shared.css" />
</head>
<body>
  <div class="phone">
    <div class="status-bar"><span data-current-time>9:41</span><span>●●●</span></div>
    <div class="content" style="justify-content:center; padding-top:48px;">
      <div class="auth-brand">
        <div class="auth-icon">📄</div>
        <div style="font-size:26px; font-weight:700;">CVQR</div>
        <div class="text-muted text-center">Share your CV with a QR code</div>
      </div>

      <div id="registerNotice" class="notice hidden"></div>

      <div class="input-group">
        <div class="label">Full Name</div>
        <input id="name" class="input" type="text" placeholder="Jane Doe" />
      </div>

      <div class="input-group">
        <div class="label">Email</div>
        <input id="email" class="input" type="email" placeholder="jane@school.com" />
        <div class="text-muted" style="font-size:12px; margin-top:6px;">Use your <strong>@school.com</strong> email to register as a student.</div>
      </div>

      <div class="input-group">
        <div class="label">Password</div>
        <input id="password" class="input" type="password" placeholder="••••••••" />
      </div>

      <div class="input-group">
        <div class="label">API Base URL</div>
        <input id="apiBase" class="input" type="text" placeholder="http://localhost:3000" />
      </div>

      <button id="registerButton" class="btn btn-primary" style="margin-top:8px;">Create Account</button>
      <a class="text-link" href="login.html">Already have an account? Log in</a>
    </div>
  </div>
  <script src="scripts/common.js"></script>
  <script src="scripts/register.js"></script>
</body>
</html>
