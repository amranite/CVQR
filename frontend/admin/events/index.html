<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CVQR - Admin events</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/common.css">
</head>
<body>

  <header class="site-header dashboard-header">
    <div class="container header-inner">
      <a class="brand" href="/admin/events/" data-refresh-current aria-label="Refresh events">
        <i class="fa-solid fa-calendar-days"></i>
        <div>
          <h1>Events</h1>
          <p>Create, edit, open, close, and inspect event locations.</p>
        </div>
      </a>
      <nav class="header-actions">
        <a class="button button-secondary" href="/admin/">Dashboard</a>
        <a class="button button-secondary is-active" href="/admin/events/">Events</a>
        <a class="button button-secondary" href="/admin/companies/">Companies</a>
        <a class="button button-secondary" href="/admin/cvs/">CVs</a>
        <a class="button button-secondary" href="/admin/registrations/">Registrations</a>
        <button type="button" class="button logout-button" id="logoutButton">Log out</button>
      </nav>
    </div>
  </header>

  <main class="container page-main grid">
    <section class="card">
      <div class="section-head">
        <div>
          <h2>Event setup</h2>
          <p class="section-text">Create a new event or edit one from the list below.</p>
        </div>
        <div class="button-row">
          <button type="button" class="button" id="createEventButton"><i class="fa-solid fa-plus"></i> Create event</button>
          <button type="button" class="button button-secondary hidden" id="cancelEditButton">Cancel</button>
        </div>
      </div>
      <div id="eventMessage" class="message hidden"></div>
      <div id="eventFormPanel" class="hidden">
        <h3 id="eventFormTitle">Create event</h3>
        <form id="eventForm" class="stack-form form-grid">
          <input type="hidden" id="eventId" name="eventId">
          <div>
            <label for="eventName">Name</label>
            <input type="text" id="eventName" name="name" required>
          </div>
          <div>
            <label for="eventLocation">Location</label>
            <input type="text" id="eventLocation" name="location" required>
          </div>
          <div>
            <label for="registrationOpensAt">Registration opens at</label>
            <input type="datetime-local" id="registrationOpensAt" name="registration_opens_at" required>
          </div>
          <div>
            <label for="registrationClosesAt">Registration closes at</label>
            <input type="datetime-local" id="registrationClosesAt" name="registration_closes_at" required>
          </div>
          <div>
            <label for="startsAt">Event starts at</label>
            <input type="datetime-local" id="startsAt" name="starts_at" required>
          </div>
          <div>
            <label for="endsAt">Event ends at</label>
            <input type="datetime-local" id="endsAt" name="ends_at" required>
          </div>
          <div class="button-row form-actions">
            <button type="submit" class="button" id="saveEventButton">Create event</button>
          </div>
        </form>
      </div>
    </section>

    <section class="card">
      <div class="section-head">
        <div>
          <h2>Event list</h2>
          <p id="eventCount" class="section-text">0 results</p>
        </div>
        <button type="button" class="button button-secondary" id="refreshButton"><i class="fa-solid fa-rotate"></i> Refresh</button>
      </div>
      <div id="eventsList" class="card-list"></div>
    </section>
  </main>

  <script src="/scripts/config.js"></script>
  <script src="/scripts/utils.js"></script>
  <script src="/scripts/admin-shared.js"></script>
  <script src="/scripts/admin-events.js"></script>
</body>
</html>
