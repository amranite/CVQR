<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CVQR - Register</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/common.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <i class="fa-solid fa-file-lines"></i>
        <div>
          <h1>CVQR</h1>
          <p>Registreren</p>
        </div>
      </div>
      <nav class="header-actions">
        <a class="button button-secondary" href="index.html">Start</a>
        <a class="button" href="02-login.html">Login</a>
      </nav>
    </div>
  </header>

  <main class="container page-main narrow-page">
    <section class="card form-card">
      <h2>Account aanmaken</h2>
      <p class="section-text">Gebruik een <strong>@school.com</strong> adres voor een studentaccount. Andere adressen worden als company geregistreerd.</p>
      <div id="message" class="message hidden"></div>
      <form id="registerForm" class="stack-form">
        <div>
          <label for="name">Naam</label>
          <input type="text" id="name" name="name" placeholder="Jane Doe" required>
        </div>
        <div>
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="jane@school.com" required>
        </div>
        <div>
          <label for="password">Wachtwoord</label>
          <input type="password" id="password" name="password" placeholder="Minstens 8 tekens" required>
        </div>
        <div class="button-row">
          <button type="submit" class="button">Account maken</button>
          <a class="button button-secondary" href="02-login.html">Ik heb al een account</a>
        </div>
      </form>
    </section>
  </main>

  <script src="scripts/config.js"></script>
  <script src="scripts/utils.js"></script>
  <script src="scripts/register.js"></script>
</body>
</html>
