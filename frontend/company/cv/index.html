<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CVQR - Scanned CV</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/common.css">
</head>
<body>

  <header class="site-header dashboard-header">
    <div class="container header-inner">
      <a class="brand" href="/company/cv/" data-refresh-current aria-label="Refresh company CV view">
        <i class="fa-solid fa-file-lines"></i>
        <div>
          <h1>Scanned CV</h1>
          <p>Review student details and open the PDF.</p>
        </div>
      </a>
      <nav class="header-actions">
        <a class="button button-secondary" href="/company/">New scan</a>
        <a class="button button-secondary" href="/company/history/">History</a>
        <button type="button" class="button logout-button" id="logoutButton">Log out</button>
      </nav>
    </div>
  </header>

  <main class="container page-main two-column wide-right">
    <section class="card">
      <h2>Student details</h2>
      <div id="message" class="message hidden"></div>
      <dl class="info-list">
        <div><dt>Name</dt><dd id="studentName">-</dd></div>
        <div><dt>Email</dt><dd id="studentEmail">-</dd></div>
        <div><dt>Event</dt><dd id="eventName">-</dd></div>
        <div><dt>Location</dt><dd id="eventLocation">-</dd></div>
        <div><dt>File</dt><dd id="fileName">-</dd></div>
        <div><dt>Version</dt><dd id="versionNumber">-</dd></div>
        <div><dt>Scanned at</dt><dd id="scannedAt">-</dd></div>
      </dl>
      <div class="button-row">
        <button type="button" id="openPdfButton" class="button">Open PDF</button>
        <button type="button" id="favoriteButton" class="button button-secondary favorite-button" disabled>
          <i class="fa-regular fa-star"></i>
          <span>Favorite</span>
        </button>
      </div>
    </section>

    <section class="card pdf-card">
      <h2>PDF preview</h2>
      <div class="pdf-frame-wrapper">
        <iframe id="pdfFrame" title="PDF preview"></iframe>
      </div>
    </section>
  </main>

  <script src="/scripts/config.js"></script>
  <script src="/scripts/utils.js"></script>
  <script src="/scripts/company-view.js"></script>
</body>
</html>
