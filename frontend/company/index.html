<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>CVQR - Company scanner</title>
   <link rel="preconnect" href="https://cdnjs.cloudflare.com">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
   <link rel="stylesheet" href="/css/common.css">
</head>

<body>
   <header class="site-header dashboard-header">
      <div class="container header-inner">
         <a class="brand" href="/company/" data-refresh-current aria-label="Refresh company scanner">
            <i class="fa-solid fa-building"></i>
            <div>
               <h1>Company scanner</h1>
               <p>Scan a QR code, upload an image, or enter a token.</p>
            </div>
         </a>
         <nav class="header-actions">
            <a class="button button-secondary" href="/company/history/">History</a>
            <button type="button" class="button logout-button" id="logoutButton">Log out</button>
         </nav>
      </div>
   </header>

   <main class="container page-main grid">
      <section class="card" id="accessNotice">
         <div class="empty-state">Checking event assignment.</div>
      </section>

      <section class="card scanner-primary hidden" id="scannerPanel">
         <div class="section-head">
            <div>
               <h2>QR scanner</h2>
               <p class="section-text">Scan a student QR code with the camera or from an image.</p>
            </div>
         </div>
         <div id="message" class="message hidden"></div>

         <div id="reader" class="scanner-reader"></div>

         <input type="file" id="imageInput" accept="image/*" class="hidden">

         <div class="button-row scanner-actions">
            <button type="button" class="button" id="startCameraButton">Start camera</button>
            <button type="button" class="button button-secondary" id="stopCameraButton">Stop camera</button>
            <button type="button" class="button button-secondary" id="pickImageButton">Choose QR image</button>
         </div>
      </section>

      <section class="card aside-card hidden" id="tokenPanel">
         <h2>Token or URL</h2>
         <form id="scanForm" class="stack-form">
            <div>
               <label for="token">QR token or URL</label>
               <input type="text" id="token" name="token" placeholder="http://localhost:3000/qr/... or just the token" required>
            </div>
            <div class="button-row">
               <button type="submit" class="button">Open CV</button>
            </div>
         </form>
      </section>

      <section class="card compact-section hidden" id="assignmentSection">
         <div class="section-head compact-section-head">
            <div>
               <h2>Assigned events</h2>
               <p id="assignmentSummary" class="section-text">Checking event assignment.</p>
            </div>
         </div>
         <div id="companyEventsList" class="card-list compact-card-list"></div>
      </section>
   </main>
   <script src="https://unpkg.com/html5-qrcode"></script>
   <script src="/scripts/config.js"></script>
   <script src="/scripts/utils.js"></script>
   <script src="/scripts/company-scan.js"></script>
</body>

</html>
