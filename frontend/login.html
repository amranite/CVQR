<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CVQR — Login</title>
  <link rel="stylesheet" href="styles/shared.css" />
</head>
<body>
  <div class="phone">
    <div class="status-bar"><span data-current-time>9:41</span><span>●●●</span></div>
    <div class="content" style="justify-content:center; padding-top:64px;">
      <div class="auth-brand" style="margin-bottom:24px;">
        <div class="auth-icon">📄</div>
        <div style="font-size:26px; font-weight:700;">Welcome back</div>
      </div>

      <div id="loginNotice" class="notice hidden"></div>

      <div class="input-group">
        <div class="label">Email</div>
        <input id="email" class="input" type="email" placeholder="jane@school.com" />
      </div>

      <div class="input-group">
        <div class="label">Password</div>
        <input id="password" class="input" type="password" placeholder="••••••••" />
      </div>

      <div class="input-group">
        <div class="label">API Base URL</div>
        <input id="apiBase" class="input" type="text" placeholder="http://localhost:3000" />
      </div>

      <button id="loginButton" class="btn btn-primary" style="margin-top:8px;">Log In</button>
      <a class="text-link" href="register.html">Don't have an account? Sign up</a>
    </div>
  </div>
  <script src="scripts/common.js"></script>
  <script src="scripts/login.js"></script>
</body>
</html>
